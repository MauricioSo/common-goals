name: Rebuild repository structure

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor == 'MauricioSo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited package with directory structure
        shell: bash
        run: |
          set -euo pipefail
          mkdir .common-goals-package
          unzip -q common-goals-public-package-no-workflows.zip -d .common-goals-package
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .common-goals-package -exec rm -rf {} +
          cp -a .common-goals-package/. .
          rm -rf .common-goals-package common-goals-public-package.zip common-goals-public-package-no-workflows.zip .github/workflows/unpack.yml
          git config user.name "MauricioSo"
          git config user.email "44930392+MauricioSo@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "Rebuild repository with preserved directory structure"
          git push
